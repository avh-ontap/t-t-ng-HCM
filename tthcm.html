<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn tập Tư tưởng Hồ Chí Minh – 240 câu trắc nghiệm</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1d2733;--mu:#667085;--bd:#d9dee6;--pr:#c0392b;--ok:#1e8e4e;--okb:#e5f6ec;--no:#c62828;--nob:#fdeaea;--wn:#8a5a00;--wnb:#fff4d6;--hv:#f0f3f8}
@media (prefers-color-scheme:dark){:root{--bg:#14181d;--card:#1d242c;--tx:#e8edf3;--mu:#9aa6b4;--bd:#34404d;--pr:#ff7b6b;--ok:#5fd18c;--okb:#173626;--no:#ff8a8a;--nob:#3b1d1d;--wn:#f2c264;--wnb:#3a2f14;--hv:#26303b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.55 "Times New Roman",Georgia,serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 14px}
.in{max-width:860px;margin:0 auto}
h1{font-size:19px;margin:0 0 6px;color:var(--pr)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.prog{flex:1 1 180px;height:8px;background:var(--bd);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s}
.st{font:14px system-ui,sans-serif;color:var(--mu);white-space:nowrap}
button{font:600 14px system-ui,sans-serif;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:8px 12px;cursor:pointer}
button:hover:not(:disabled){background:var(--hv)}
button.pri{background:var(--pr);border-color:var(--pr);color:#fff}
button.pri:hover:not(:disabled){filter:brightness(1.08);background:var(--pr)}
button:disabled{opacity:.45;cursor:not-allowed}
main{max-width:860px;margin:0 auto;padding:14px}
#sum{display:none;background:var(--okb);border:1px solid var(--ok);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-family:system-ui,sans-serif;font-size:15px}
#grid{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:16px}
#grid a{font:12px system-ui,sans-serif;min-width:30px;text-align:center;padding:3px 0;border-radius:5px;border:1px solid var(--bd);background:var(--card);color:var(--mu);text-decoration:none}
#grid a.ok{background:var(--okb);border-color:var(--ok);color:var(--ok)}
#grid a.no{background:var(--nob);border-color:var(--no);color:var(--no)}
#grid a.rv{background:var(--wnb);border-color:var(--wn);color:var(--wn)}
.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin-bottom:14px;scroll-margin-top:90px}
.qh{font-weight:700;margin-bottom:8px}
.qh small{font:12px system-ui,sans-serif;color:var(--mu);font-weight:400;margin-left:6px}
.op{display:flex;gap:10px;width:100%;text-align:left;font:17px/1.45 "Times New Roman",Georgia,serif;font-weight:400;padding:9px 12px;margin:6px 0;border-radius:9px}
.op b{flex:0 0 auto;min-width:22px;color:var(--pr)}
.op.ok{background:var(--okb);border-color:var(--ok)}
.op.no{background:var(--nob);border-color:var(--no)}
.op.ok b{color:var(--ok)}.op.no b{color:var(--no)}
.op:disabled{opacity:1;cursor:default}
.res{display:none;font:14px system-ui,sans-serif;margin-top:8px}
.res .a{font-weight:700;color:var(--ok)}
.res .w{margin-top:6px;background:var(--wnb);color:var(--wn);padding:6px 10px;border-radius:7px}
.show{font:13px system-ui,sans-serif;padding:4px 9px;margin-top:6px}
</style>
</head>
<body>
<header><div class="in">
<h1>Ôn tập Tư tưởng Hồ Chí Minh – 240 câu</h1>

<button id="rst">Làm lại từ đầu</button>
</div></div></header>
<main>
<div id="sum"></div>
<div id="grid"></div>
<div id="list"></div>
</main>
<script>
const DATA=[{"n":1,"q":"Thuật ngữ “Tư tưởng HCM” được dùng theo nghĩa nào?","o":{"a":"Là tư tưởng của một cá nhân","b":"Là tư tưởng của một giai cấp, dân tộc","c":"Là tư tưởng của lãnh tụ","d":"Là tất cả những vấn đề trên"},"a":"d","u":1},{"n":2,"q":"Tìm đáp án sai: Khái niệm Tư tưởng Hồ Chí Minh mà Đại hội IX nêu lên bao gồm:","o":{"a":"Bản chất cách mạng và khoa học của Tư tưởng Hồ Chí Minh","b":"Nguồn gốc tư tưởng và lý luận của Tư tưởng Hồ Chí Minh","c":"Nội dung Tư tưởng Hồ Chí Minh","d":"Kết cấu Tư tưởng Hồ Chí Minh"},"a":"d","u":0},{"n":3,"q":"Đối tượng của môn học Tư tưởng Hồ Chí Minh?","o":{"a":"Quá trình sản sinh Tư tưởng Hồ Chí Minh","b":"Quá trình hiện thực hóa Tư tưởng Hồ Chí Minh","c":"Quá trình sản sinh và hiện thực hóa Tư tưởng Hồ Chí Minh","d":"Quá trình Đảng Cộng sản Việt Nam vận dụng Tư tưởng Hồ Chí Minh"},"a":"c","u":0},{"n":4,"q":"Bộ môn Tư tưởng Hồ Chí Minh có mấyhiệm vụ khi nghiên cứu Tư tưởng Hồ Chí Minh?","o":{"a":"4 nhiệm vụ","b":"5 nhiệm vụ","c":"6 nhiệm vụ","d":"7 nhiệm vụ"},"a":"b","u":1},{"n":5,"q":"Tư tưởng Hồ Chí Minh có vị trí như thế nào trong hệ thống tư tưởng của Đảng Cộng sản Việt Nam?","o":{"a":"Là một bộ phận trong hệ thống tư tưởng của Đảng","b":"Là một bộ phận quan trọng trong hệ thống tư tưởng của Đảng","c":"Là một bộ phận rất quan trọng trong hệ thống tư tưởng của Đảng","d":"Là một bộ phận nền tảng, kim chỉ nam cho hành động của Đảng"},"a":"d","u":0},{"n":6,"q":"Có mấy nguyên tắc phương pháp luận khi nghiên cứu Tư tưởng Hồ Chí Minh?","o":{"a":"4 nguyên tắc","b":"5 nguyên tắc","c":"6 nguyên tắc","d":"7 nguyên tắc"},"a":"b","u":0},{"n":7,"q":"Vấn đề mà giáo trình Tư tưởng Hồ Chí Minh chưa nêu khi nói về ý nghĩa của việc học tập và nghiên cứu môn học này của sinh viên?","o":{"a":"Nâng cao năng lực tư duy lý luận và phương pháp công tác","b":"Bồi dưỡng phẩm chất đạo đức cách mạng và rèn luyện bản lĩnh chính trị.","c":"Nâng cao lòng tự hòa dân tộc, tự hòa về bác Hồ kính yêu.","d":"Bồi dưỡng tình yêu thiên nhiên, ý thức bảo vệ môi trường"},"a":"d","u":0},{"n":8,"q":"Mối quan hệ của môn học tư tưởng Hồ Chí Minh với môn học những nguyên lý cơ bản của chủ nghĩa Mác- Lênin là như thế nào?","o":{"a":"Không có mối quan hệ nào cả","b":"Có mối quan hệ biện chứng, chặc chẽ","c":"Có mối quan hệ xa rời, không gắn bó.","d":"Tất cả các câu trên đều sai."},"a":"b","u":0},{"n":9,"q":"Nhiệm vụ đầu tiên mà Bộ môn tư tưởng Hồ Chí Minh có nhiệm vụ đi sâu làm rõ?","o":{"a":"Cơ sở hình thành tư tưởng Hồ Chí Minh (khách quan và chủ quan)","b":"Các giai đoạn hình thành, phát triển tư tưởng Hồ Chí Minh","c":"Vai trò nền tảng của tư tưởng Hồ Chí Minh đối với cách mạng Việt Nam","d":"Các giá trị tư tưởng lý luận của Hồ Chí Minh đối với kho tàng tư tưởng cách mạng thế giới"},"a":"a","u":0},{"n":10,"q":"Cơ sở phương pháp luận quan trọng đầu tiên trong nghiên cứu Tư tưởng Hồ Chí Minh là gì?","o":{"a":"Đảm bảo sự thống nhất nguyên tắc tính Đảng và tính khoa học","b":"Quan điểm thực tiễn và nguyên tắc lý luận gắn liền với thực tiễn","c":"Quan điểm lịch sử- cụ thể","d":"Quan điểm toàn diện và hệ thống"},"a":"a","u":0},{"n":11,"q":"“Đảng lấy chủ nghĩa Mác – Lênin và tư tưởng Hồ Chí Minh làm nền tảng tư tưởng và kim chỉ nam cho hành động”.Câu nói trên được Đảng ta khẳng định tại Đại hội lần thứ mấy của Đảng?","o":{"a":"Lần thứ VI","b":"Lần thứ VIII","c":"Lần thứ VII","d":"Lần thứ IX"},"a":"c","u":0},{"n":12,"q":"Hồ Chí Minh khẳng định: “Thực tiễn không có lý luận định hướng thì thành thực tiễn mù quáng, dễ mắc bệnh chủ quan, duy ý chí; lý luận mà không liên hệ với thực tiễn là…”. Điền cụn từ còn thiếu?","o":{"a":"Lý luận mù quáng","b":"Lý luận suông","c":"Lý thuyết suông","d":"Tất cả đều sai."},"a":"b","u":0},{"n":13,"q":"Khi nghiên cứu Tư tưởng Hồ Chí Minh, ta nên sử dụng phương pháp nào?","o":{"a":"Phương pháp lịch sử và logic","b":"Phương pháp liên ngành khoa học xã hội và nhân văn, lý luận chính trị","c":"Phương pháp phân tích; so sánh; tổng hợp, phỏng vấn các nhân chứng lịch sử.","d":"Tất cả các phương pháp trên."},"a":"d","u":0},{"n":14,"q":"“Một người xứng đáng là nhà tư tưởng khi nào biết giải quyết trước người khác tất cả những vấn đề chính trị- sách lược, các vấn đề về tổ chức, về những yếu tố vật chất của phong trào không phải một cách tự phát”. Là câu nói của ai?","o":{"a":"Mác","b":"Lênin","c":"Ăng-ghen","d":"Hồ Chí Minh"},"a":"b","u":0},{"n":15,"q":"“Tư tưởng Hồ Chí Minh soi đường cho cuộc đấu tranh của nhân dân ta giành thắng lợi, là tài sản tinh thần to lớn của Đảng và của dân tộc ta”. Là câu nói được nêu trong Văn kiện lần thứ mấy của Đảng Cộng sản Việt Nam?","o":{"a":"Văn kiện Đại hội đại biểu toàn quốc lần thứ IX.","b":"Văn kiện Đại hội đại biểu toàn quốc lần thứ X.","c":"Văn kiện Đại hội đại biểu toàn quốc lần thứ XI.","d":"Văn kiện Đại hội đại biểu toàn quốc lần thứ VIII."},"a":"a","u":0},{"n":16,"q":"Thân phụ Hồ Chí Minh là Nguyễn Sinh Sắc. ông sinh năm nào?","o":{"a":"1860","b":"1862","c":"1863","d":"1883"},"a":"b","u":0},{"n":17,"q":"Nguyễn Sinh Cung (Hồ Chí Minh) đến Huế lần thứ nhất vào năm nào ?","o":{"a":"1895","b":"1896","c":"1898","d":"1901"},"a":"a","u":0},{"n":18,"q":"Nguyễn Tất Thành lần đầu tiên được nghe khẩu hiệu TỰ DO-BÌNH ĐẲNG-BÁC ÁI của Pháp vào năm nào?","o":{"a":"9/1903","b":"9/1904","c":"9/1905","d":"10/1925"},"a":"c","u":0},{"n":19,"q":"Nguyễn Tất Thành đã dừng chân ở Phan Thiết vào năm nào?","o":{"a":"9/1908","b":"9/1909","c":"9/1910","d":"9/1911"},"a":"c","u":0},{"n":20,"q":"Nguyễn Tất Thành lúc ra đi tìm đường cứu nước bao nhiêu tuổi?","o":{"a":"19 tuổi","b":"20 tuổi","c":"21 tuổi","d":"22 tuổi"},"a":"c","u":0},{"n":21,"q":"Nguyễn Tất Thành –Nguyễn Ai Quốc nhắc lại: “Khi tôi độ 13 tuổi, lần đầu tiên tôi được nghe ba chữ Pháp: Tự do, bình đẳng, bác ái … và từ thuở ấy, tôi rất muốn làm quen với nền văn minh Pháp, muốn tìm xem những gì ẩn sau những từ ấy” vào năm nào?","o":{"a":"1920","b":"1921","c":"1923","d":"1924"},"a":"c","u":0},{"n":22,"q":"Từ 6/1911 đến cuối 1913, Nguyễn Ái Quốc làm phụ bếp thuỷ thủ trên các tàu biển đi từ Đông Nam Á sa ên."},"a":"b","u":0},{"n":98,"q":"Ham muốn tột bậc của Hồ Chí Minh là gì?","o":{"a":"Mọi người đều vui vẻ","b":"Nước được độc lập, Dân tự do","c":"Đồng bào ai cũng có cơm ăn, áo mặt, được học hành.","d":"Đáp án B và C là đúng"},"a":"d","u":0},{"n":99,"q":"Theo Hồ Chí Minh, con đường đi lên Chủ nghĩa xã hội trong nông nghiệp bao những bước nào?","o":{"a":"Cải cách ruộng đất","b":"Xây dựng hợp tác xã cấp thấp","c":"Xây dựng hợp tác xã cấp thấp và cao","d":"Cả a, b, c đều đúng"},"a":"d","u":0},{"n":100,"q":"Trong Di Chúc, Hồ Chí Minh mong muốn đều cuối cùng của mình là gì?","o":{"a":"Làm cho mọi người dân hạnh phúc","b":"Xây dựng một nước Việt Nam giàu mạnh","c":"Xây dựng một nước Việt Nam hòa bình, thống nhất, độc lập, dân chủ, giàu mạnh và góp phần xứng đáng vào sự nghiệp cách mạng thế giới.","d":"Tất cả các nội dung trên."},"a":"c","u":0},{"n":101,"q":"Đảng cộng sản là sự kết hợp giữa chủ nghĩa Mác và phong trào công nhân. Ai nói về quy luật ra đời của Đảng cộng sản như trên?","o":{"a":"C. Mác","b":"Lê-nin","c":"Stalin","d":"Hồ Chí Minh"},"a":"b","u":0},{"n":102,"q":"Chủ nghĩa Mác- Lênin kết hợp với phong trào công nhân và phong trào yêu nước dẫn tới sự ra đời của Đảng cộng sản Việt Nam. Câu trên trích từ tác phẩm nào của chủ tịch Hồ Chí Minh?","o":{"a":"Đường cách mệnh","b":"Thường thức chính trị","c":"Diễn văn chính trị đọc tại đại hội III","d":"Ba mươi năm hoạt động của Đảng"},"a":"d","u":0},{"n":103,"q":"Ai soạn thảo “ Chánh cương vắng tắt”, Sách lược vắng tắt”, “Chương trình điều lệ tóm tắt của Đảng”.","o":{"a":"Trần Đình Cửu","b":"Lê Hồng Phong","c":"Trần Phú","d":"Nguyễn Ái Quốc"},"a":"d","u":0},{"n":104,"q":"Ai chủ trì hội hợp nhất 3 tổ chức của Đảng cộng sản nước ta?","o":{"a":"Trần Đình cửu","b":"Phan Bội Châu","c":"Nguyễn Ái Quốc","d":"Lê Hồng Phong"},"a":"c","u":0},{"n":105,"q":"“ Trong những luận điểm dưới đây của Hồ Chí Minh về xây dựng Đảng cộng sản, luận điểm nào được hồ Chí Minh viết lần đầu trong tác phẩm Đường kách mệnh?","o":{"a":"Chủ nghĩa Mác – Lênin kết hợp với phong trào công nhân và phong trào yêu nước đã dẫn tới việc thành lập Đảng cộng sản Đông dương vào đầu năm 1930","b":"Đảng ta là Đảng của giai cấp công nhân, đồng thời là Đảng của dân tộc, không thiên tư, thiên vị","c":"Đảng muốn vững thì phải có chủ nghĩa làm cốt","d":"Phải giữ gìn Đảng ta thật trong sạch, phải xứng đáng là người lãnh đạo, là người đầy tớ thật trung thành của nhân dân"},"a":"c","u":0},{"n":106,"q":"Đảng cộng sản Việt Nam, do Hồ Chí Minh sáng lập và lãnh đạo, hoạt động vì lợi ích của ai?","o":{"a":"Vì lợi ích của bản thân Đảng","b":"Vì lợi ích của giai cấp công nhân","c":"Vì lợi ích của công nhân, nông dân, tri thức","d":"Vì lợi ích của dân tộc Việt Nam."},"a":"d","u":0},{"n":107,"q":"Đảng lãnh đạo là nhân tố có ý nghĩa như thế nào đối với thắng lợi cách mạng nước ta?","o":{"a":"Có ý nghĩa quan trọng","b":"Có ý nghĩa rất quan trọng","c":"Có ý nghĩa quan trọng đặc biệt","d":"Có ý nghĩa quyết định hàng đầu thắng lợi của cách mạng nước ta"},"a":"d","u":0},{"n":108,"q":"Hồ Chí Minh diễn đạt như thế nào về vấn đề “Đảng của ai”?","o":{"a":"Đảng lao đông Việt Nam là đảng của giai cấp công nhân và nhân dân lao động, nên nó phải là đảng của dân tộc Việt Nam.","b":"Đảng lao động là tổ chức cao nhất của giai cấp công nhân và nhân dân lao động, nên nó phải là đảng của giai cấp cần lao và đại biểu lợi ích của cả dân tộc.","c":"Đảng là đảng của giai cấp lao động, mà cũng là đảng của toàn dân","d":"Tất cả 3 câu trên."},"a":"d","u":0},{"n":109,"q":"Vì sao số đông nhân dân Việt Nam coi Đảng cộng sản Việt Nam là đảng của mình?","o":{"a":"Vì đảng tự nhận như thế","b":"Vì đảng đảng là lực lượng lãnh đạo đất nước","c":"Vì sách báo nói nhiều nên trở thành thói","d":"Vì đảng hoạt động vì lợi ích của họ"},"a":"d","u":0},{"n":110,"q":"Trong các thuật ngữ chỉ vai trò Đảng lãnh đạo xã hội mà chủ tịch Hồ Chí Minh thường dùng sau đây thì thuật ngữ nào phản ánh rõ nhất, chính xát nhất vai trò lãnh đạo của đảng ?","o":{"a":"Đảng nắm quyền","b":"Đảng lãnh đạo chính quyền","c":"Đảng cầm quyền","d":"Các thuật ngữ trên điều phản ánh rõ vai trò của đảng"},"a":"c","u":1},{"n":111,"q":"Trong tư tưởng Hồ Chí Minh: Là người lãnh đạo, Đảng phải có những phẩm chất gì?","o":{"a":"Tư cách, đạo đức, năng lực cần thiết","b":"Phải có khả năng làm cho dân tin, dân mến, dân phục, dân theo","c":"Đảng phải gắn bó mật thiết với nhân dân, nghe ý kiến của dân, học nhân dân, chịu sự kiểm soát của nhân dân","d":"Tất cả những phẩm chất trên"},"a":"d","u":0},{"n":112,"q":"Chọn đáp án sai trong những đáp án được rút ra từ những mệnh đề sau: “Đảng ta vừa là người lãnh đạo vừa là người đầy tớ thật trung thành của nhân dân”","o":{"a":"Là tôi tớ, là tôi đòi, theo đuôi quần chúng","b":"Là tận tâm, tận lực phụng sự quần chúng","c":"Là việc gi có lợi cho dân thì phải hết sức làm, việc gi có hại cho thì phải hết sức tránh","d":"Là khổ trước thiên hạ, vui sau thiên hạ"},"a":"a","u":0},{"n":113,"q":"Theo Hồ Chí Minh , nền tảng tư tưởng của đảng cộng sản việt Nam là:","o":{"a":"Tinh hoa văn hóa dân tộc Việt Nam","b":"Tinh hoa văn hóa nhân loại","c":"Là tinh hoa văn hóa dân tộc và tinh hoa văn hóa nhân loại","d":"Là chủ nghĩa Mác-Lênin"},"a":"d","u":0},{"n":114,"q":"Trong tư tưởng Hồ Chí Minh, luận điểm: “Sự lãnh đạo của Đảng là nhân tố hàng đầu đưa cách mạng nước ta đến thắng lợi”, là để:","o":{"a":"Xác định vị thế cầm quyền của Đảng.","b":"Xác định mục đích của Đảng.","c":"Xác định vai trò lãnh đạo của Đảng.","d":"Xác định nhiệm vụ của Đảng."},"a":"c","u":0},{"n":115,"q":"Luận điểm “ Đảng cộng sản là đảng của giai cấp công nhân, của nhân dân lao động và của cả dân tộc”, là nhằm:","o":{"a":"Xác định vai trò lãnh đạo của Đảng","b":"Xác định vị thế cầm quyền của Đảng","c":"Xác định bản chất của Đảng","d":"Xác định chức năng, nhiệm vụ của Đảng"},"a":"c","u":0},{"n":116,"q":"Bản chất của Đảng cộng sản Việt Nam được thể hiện ở chỗ?","o":{"a":"Số lượng đảng viên của Đảng","b":"Năng lực lãnh đạo của đảng viên","c":"Nền tảng tư tương, đường lối lãnh đạo, nguyên tắc tố chức của Đảng","d":"Số lượng Đảng viên là công nhân chiếm đa số trong Đảng"},"a":"c","u":0},{"n":117,"q":"Trong tư tưởng Hồ Chí Minh, có mấy nội dung xây dựng Đảng?","o":{"a":"2 nội dung","b":"3 nội dung","c":"4 nội dung","d":"5 nội dung"},"a":"c","u":1},{"n":118,"q":"“Đảng muốn vững, phải có chủ nghĩa làm cốt, trong Đảng ai cũng phải hiểu, ai cũng phải theo chủ nghĩa ấy. Đảng không có chủ nghĩa cũng như người không có trí khôn, tàu không có bàn chỉ nam”. Chủ nghĩa mà Hồ Chí Minh nói ở đây là chủ nghĩa gì?","o":{"a":"Chủ nghĩa Quốc gia- dân tộc","b":"Chủ nghĩa quốc tế","c":"Chủ nghĩa tam dân","d":"Chủ nghĩa Mac- lênin"},"a":"d","u":0},{"n":119,"q":"Trong xây dựng Đảng về chính trị, vấn đề nào là” cốt tử”?","o":{"a":"Xây dựng và thực hiện nghị quyết của Đảng","b":"Cũng cố lập trường chính trị","c":"Nâng cao bản lĩnh chính trị của đảng viên","d":"Xây dựng đường lối chính trị"},"a":"d","u":1},{"n":120,"q":"Trong tư tưởng Hồ Chí Minh, có mấy nguyên tắc xây dựng Đảng?","o":{"a":"5 nguyên tắc","b":"7 nguyên tắc","c":"6 nguyên tắc","d":"4 nguyên tắc"},"a":"a","u":1},{"n":121,"q":"Đảng ta là một đảng cầm quyền, các đồng chí từ chi bộ đến Trung ương, phải giữ gìn sự đoàn kết nhất trí trong Đảng như giữ gìn con ngươi của mắt mình. Câu trên trích từ tác phẩm nào của Hồ Chí Minh?","o":{"a":"Diễn văn chính trị tại đại hội III của Đảng","b":"Bài nói chuyện tại trường Nguyên Ái Quốc trung ương năm 1957","c":"Di chúc","d":"Bài nói chuyện với cán bộ cao cấp quân đội nhân dân Việt Nam."},"a":"c","u":0},{"n":122,"q":"Trong tư tưởng Hồ Chí Minh, đặc trưng nổi bật nhất của đạo đức cộng sản là gì?","o":{"a":"Tình thương dành cho công nhân","b":"Tình thương dành cho người nghèo","c":"Tình thương dành cho con người","d":"Chủ nghĩa nhân đạo chiến đấu"},"a":"c","u":1},{"n":123,"q":"Hồ Chí Minh viết tác phẩm “Nâng cao đạo đức cách mạng, quét sạch chủ nghĩa cá nhân” nhân kỷ niệm lần thứ bao nhiêu ngày thành lập Đảng ta?","o":{"a":"19 năm","b":"29 năm","c":"29 năm","d":"39 năm"},"a":"d","u":0},{"n":124,"q":"Nhân dân ta thường nói: “Đảng viên đi trước, làng nước theo sau” câu nói đó của Hồ Chí Minh ở trong tác phẩm nào của Người?","o":{"a":"Đạo đức cách mạng","b":"Đường cách mệnh","c":"Nâng cao đạo đức cách mạng, quét sạch chủ nghĩa cá nhân","d":"Sửa đổi lề lối làm việc"},"a":"d","u":0},{"n":125,"q":"Theo Hồ Chí Minh đại đoàn kết dân tộc có ý nghĩa thế nào trong sự nghiệp cách mạng?","o":{"a":"Rất quan trọng","b":"Đặc biệt quan trọng","c":"Là vấn đề có ý nghĩa sách lược","d":"Là vấn đề chiến lược quyết định thắng lợi của cách mạng"},"a":"d","u":0},{"n":126,"q":"“Trong những luận điểm của Hồ Chí Minh về đại đoàn kết dân tộc, luận điểm nào dưới đây được viết trong Di chúc?","o":{"a":"Ta đoàn kết đấu tranh cho thống nhất và độc lập của Tổ quốc","b":"Ta còn phải đòan kết để xây dựng nước nhà","c":"Đoàn kết là một truyền thống cực kỳ quý báu của Đảng và nhân dân ta","d":"Để đoàn kết phải có lòng khoan dung, đại độ với con người."},"a":"c","u":0},{"n":127,"q":"Mục đích của Đảng lao động Việt Nam có thể thể gồm trong tám chữ là: “Đoàn kết toàn dân, phụng sự tổ quốc”. Bác Hồ viết câu trên vào thời gian nào?","o":{"a":"3/3/1950","b":"3/3/1951","c":"3/3/1952","d":"3/3/1953"},"a":"b","u":0},{"n":128,"q":"Chính sách đại đoàn kết dân tộc của Hồ Chí Minh có mấy nội dung?","o":{"a":"1 nội dung","b":"3 nội dung","c":"2 nội dung","d":"4 nội dung"},"a":"b","u":1},{"n":129,"q":"“Sông to, biển rộng thì bao nhiêu nước cũng chứa được, vì độ lượng nó sâu. Cái chén nhỏ, cái đĩa cạn, thì một chút nước đã tràn đầy, vì độ lượng nó hẹp nhỏ. Người mà tự kêu, tự mãn, cũng như cái chén, cái đĩa cạn”. Câu trên của Bác Hồ ngụ ý gì?","o":{"a":"Phê bình một số cán bộ, đảng viên kêu căn, tự mãn","b":"Phê phán lối sống hẹp hòi, ích kỉ","c":"Giáo dục cán bộ, đảng viên và quần chúng lòng khoan dung, độ lượng với những người có sai lầm, khuyết điểm","d":"Cả 3 ý trên"},"a":"d","u":0},{"n":130,"q":"Lòng khoan dung, độ lượng của Hồ Chí Minh đối với những người lầm đường, lạc lối, là sự biểu hiện:","o":{"a":"Một sách lược cách mạng nhất thời","b":"Một thủ đoạn chính trị","c":"Một thủ đoạn mỵ dân","d":"Một tư tưởng nhất quán, một mục tiêu của cách mạng mà suốt đời Bác theo đuổi"},"a":"d","u":0},{"n":131,"q":"Hình thức tổ chức của khối đại đoàn kết dân tộc là gì?","o":{"a":"Là đảng cộng sản","b":"Là nhà nước của dân, do dân và vì dân","c":"Là các tổ chức hội, đoàn của quần chúng","d":"Là mặt trận dân tộc thống nhất"},"a":"d","u":0},{"n":132,"q":"Mặt trận dân tộc thống nhất có mấy tên gọi?","o":{"a":"4 tên","b":"5 tên","c":"6 tên","d":"7 tên"},"a":"d","u":0},{"n":133,"q":"Có mấy nguyên tắc xây dựng và hoạt động của Mặt trận dân tộc thống nhất?","o":{"a":"3 nguyên tắc","b":"5 nguyên tắc","c":"4 nguyên tắc","d":"6 nguyên tắc"},"a":"c","u":1},{"n":134,"q":"Theo tư tưởng Hồ Chí Minh có mấy nội dung đoàn kết quốc tế?","o":{"a":"1 nội dung","b":"2 nội dung","c":"3 nội dung","d":"4 nội dung"},"a":"c","u":0},{"n":135,"q":"Theo Hồ Chí Minh chúng ta cần đoàn kết với những đối tượng quốc tế nào?","o":{"a":"Phong trào cộng sản và công nhân thế giới","b":"Phong trào đấu tranh giải phóng dân tộc","c":"Lực lượng tiến bộ, yêu chuộng hòa bình, dân chủ, tự do và công lý","d":"Cả 3 đối tượng trên"},"a":"d","u":0},{"n":136,"q":"Sinh thời Hồ Chí Minh hình thành lập được mấy tầng mặt trận nhân dân thế giới đoàn kết với Việt Nam?","o":{"a":"2 tầng","b":"3 tầng","c":"4 tầng","d":"5 tầng"},"a":"b","u":0},{"n":137,"q":"Theo tư tưởng Hồ Chí Minh có mấy nguyên tắc xây dựng khối đoàn kết quốc tế?","o":{"a":"2 nguyên tắc","b":"3 nguyên tắc","c":"4 nguyên tắc","d":"5 nguyên tắc"},"a":"c","u":1},{"n":138,"q":"Đối với phong trào cộng sản và công nhân quốc tế, đối với các dân tộc trên thế giới, đối với các lực lượng tiến bộ trên thế giới Hồ Chí Minh đã giương cao ngọn cờ gì để xây dựng khối đoàn kết quốc tế?","o":{"a":"Độc lập dân tộc gắn liền với chủ nghĩa xã hội","b":"Độc lập, tự do và quyền bình đẳng của các dân tộc","c":"Hòa bình trong công lý","d":"Cả 3 ngọn cờ trên"},"a":"d","u":0},{"n":13 n việc thành công hay thất bại là do cán bộ tốt hay….","o":{"a":"Xấu","b":"Kém","c":"Giỏi","d":"Yếu"},"a":"b","u":0},{"n":148,"q":"Theo Hồ Chí Minh, “giặc nội xâm” bao gồm những yếu tố nào?","o":{"a":"Tham ô","b":"Quan liêu","c":"Lãng phí","d":"Cả a, b, c"},"a":"d","u":0},{"n":149,"q":"Khẩu hiệu chiến lược: “Giai cấp vô sản tất cả các nước và các dân tộc bị áp bức đoàn kết lại” là của tác giả nào?","o":{"a":"Hồ Chí Minh","b":"V. Lê-nin","c":"C. Mác","d":"Ph. Ănghen"},"a":"a","u":0},{"n":150,"q":"Luận điểm: “Đoàn kết, đoàn kết, đại đoàn kết Thành công, thành công, đại thành công”. Được trích từ tác phẩm nào của Hồ Chí Minh?","o":{"a":"Bài nói chuyện trong lễ bế mạc tại Đại hội thành lập Mặt trận tổ quốc Việt Nam?","b":"Bài nói chuyện tại lớp bồi dưỡng cán bộ về công tác Mặt trận.","c":"Bài nói chuyện tại Hội nghị mở rộng của Ủy ban Trung ương Mặt trận Tổ quốc.","d":"Bài nói chuyện tại Đại hội đại biểu Mặt trận Tổ quốc lần thứ II."},"a":"a","u":1},{"n":151,"q":"Chọn phương án trả lời đúng nhất theo Tư tưởng Hồ Chí Minh về một nguyên nhân sâu xa dẫn đến cuộc đấu tranh cứu nước của nhân dân ta cuối thế kỷ XIX, đầu thế kỷ XX thất bại?","o":{"a":"Cả nước không đoàn kết được thành một khối thống nhất","b":"Lãnh đạo cuộc kháng chiến là các sĩ phu yêu nước","c":"Con đường cứu nước theo hệ tư tưởng phong kiến đã lỗi thời trước nhiệm vụ của lịch sử.","d":"Cả a, b, c."},"a":"c","u":0},{"n":152,"q":"Chọn câu trả lời đúng theo Tư tưởng Hồ Chí Minh","o":{"a":"Đoàn kết dân tộc là vấn đề sách lược","b":"Đoàn kết dân tộc là vấn đề chiến lược","c":"Đoàn kết dân tộc là phương pháp chính trị","d":"Đoàn kết dân tộc là một chính sách chính trị"},"a":"b","u":0},{"n":153,"q":"Lực lượng chủ yếu của Khối đại đoàn kết dân tộc theo Tư tưởng Hồ Chí Minh?","o":{"a":"Công nhân","b":"Nông dân","c":"Trí thức","d":"Cả a, b, c."},"a":"d","u":0},{"n":154,"q":"Chọn câu trả lời đúng theo Tư tưởng Hồ Chí Minh?","o":{"a":"Đảng Cộng sản Việt Nam là một thành viên của Mặt trận dân tộc thống nhất?","b":"Đảng Cộng sản Việt Nam là lực lượng lãnh đạo Mặt trận?","c":"Đảng Cộng sản Việt Nam vừa là thành viên, vừa là lực lượng lãnh đạo Mặt trận dân tộc thống nhất?","d":"Đảng Cộng sản Việt Nam là một bộ phận nhỏ của Mặt trận dân tộc thống nhất"},"a":"c","u":0},{"n":155,"q":"Chọn câu trả lời đúng nhất?","o":{"a":"Mặt trận dân tộc thống nhất là tổ chức của các đoàn thể, các đảng phái, các nhân sĩ.","b":"Mặt trận dân tộc thống nhất là tổ chức của các tầng lớp nhân dân.","c":"Mặt trận dân tộc thống nhất là tổ chức của các giai cấp công nhân, nông dân và lao động trí óc.","d":"Mặt trận dân tộc thống nhất là nơi quy tụ mọi tổ chức và cá nhân trong và ngoài nước."},"a":"d","u":0},{"n":156,"q":"Chọn phương án đúng nhất? Để tranh thủ sự sự giúp đở của các nước xã hội chủ nghĩa, trong đấu tranh cách mạng cần coi trọng nhân tố:","o":{"a":"Tự lực cánh sinh, dựa vào sức mình là chính","b":"Có đường lối độc lập, tự chủ đúng đắn","c":"Dựa vào nguồn lực ngoại sinh là chính","d":"Trường kỳ kháng chiến nhất định thành công."},"a":"a","u":0},{"n":157,"q":"Chọn phương án đúng nhất theo tư tưởng Hồ Chí Minh về nguyên tắc ngoại giao?","o":{"a":"Phải cứng rắn về nguyên tắc","b":"Phải mềm dẻo về sách lược","c":"Phải cứng rắn về nguyên tắc, vừa mềm dẻo về sách lược.","d":"“Dĩ bất biến, ứng vạn biến”"},"a":"c","u":0},{"n":158,"q":"Người nói: “Tinh thần yêu nước chân chính khác hẳn với tinh thần vị quốc của bọn đế quốc phản động. Nó là một bộ phận của tinh thần quốc tế”. Được trích trong tác phẩm nào?","o":{"a":"Thường thức chính trị","b":"Báo cáo chính trị tại Đại hội II (2/1951)","c":"Đường cách mệnh","d":"Bản án chế độ thực dân Pháp"},"a":"b","u":0},{"n":159,"q":"Hồ Chí Minh tuyên bố: Chính sách đối ngoại của nước Việt Nam là “làm bạn với tất cả mọi nước dân chủ và không gây thù oán với một ai”. Câu nói trên diễn ra vào thời gian nào?","o":{"a":"Tháng 9/1947","b":"Tháng 11/1948","c":"Tháng 12/1949","d":"Tháng 01/1950"},"a":"a","u":1},{"n":160,"q":"Theo Hồ Chí Minh, muốn xây dựng một nhà nước pháp quyền có hiệu lực pháp lý mạnh mẽ, cần phải làm tốt những công việc chủ yếu sau đây. Hỏi : trong những công việc đó, công việc nào hiện nay đang tiến triển chậm nhất?","o":{"a":"Trước hết phải tổ chức sớm một nhà nước hợp hiến","b":"Nhà nước phải quản lý đất nước bằng pháp luật và làm cho pháp luật có hiệu lực thực tế","c":"Nhanh chóng đào tạo đội ngũ viên chức nhà nước am hiểu pháp luật, thành thạo nghiệp vụ, có đạo đức.","d":"Xây dựng một nền hành chính dân chủ, trong sạch, vững mạnh, kiên quyết chống 3 thứ “ giặc nội xâm” là tham ô, lãng phí, quan liêu"},"a":"d","u":1},{"n":161,"q":"Theo Hồ Chí Minh, đại đoàn kết là công việc của toàn dân tộc, song nó chỉ có thể được cũng cố và phát triển vững chắc khi….","o":{"a":"Có sự lãnh đạo của Đảng","b":"Có đường lối chính trị rỏ ràng","c":"Có niềm tin thắng lợi","d":"Có sự thống nhất cao của nhân dân"},"a":"a","u":0},{"n":162,"q":"Trong những luận điểm về một nhà nước của dân, do dân, vì dân của Hồ Chí Minh dưới đây, luận điểm nào trực tiếp thể hiện tư tưởng nhà nước vì dân?","o":{"a":"Nước ta là nước dân chủ","b":"Cách mệnh rồi thì quyền giao cho dân chúng số nhiều, chớ để trong tay một bọn ít người.","c":"Hễ chính phủ nào mà có hại cho dân chúng thì dân chúng phải đạp đổ chính phủ ấy đi và gây nên chính phủ khác","d":"Việc gì có lợi cho dân ta phải hết sức làm. Việc gì có hại cho dân, ta phải hết sức tránh"},"a":"d","u":0},{"n":163,"q":"Theo Hồ Chí Minh, Mặt trận dân tộc thống nhất hoạt động theo nguyên tắc nào?","o":{"a":"Vì nước, vì dân","b":"Yêu nước thương dân","c":"Hiệp thương dân chủ, đảm bảo đoàn kết ngày càng rộng rải và bền vững","d":"Tiếp tục cơ cấu"},"a":"c","u":0},{"n":164,"q":"Hồ Chí Minh đã từng nói: “Nhân danh toàn thể loài người, nhân danh tất cả các đảng viên xã hội, cả phải hữu lẫn phái tả, chúng tôi kêu gọi: Các đồng chí hãy cứu chúng tôi”. Câu nói trên được nói trong thời gian nào?","o":{"a":"Tháng 12/1920","b":"Tháng 12/1921","c":"Tháng 11/1922","d":"Tháng 3/1921"},"a":"a","u":0},{"n":165,"q":"Quốc hội khóa I của nước ta được bầu ra từ thời gian nào?","o":{"a":"Năm 1945","b":"Năm 1946","c":"Năm 1948","d":"Năm 1950"},"a":"b","u":0},{"n":166,"q":"Quốc hội khóa I của nước ta có bao nhiêu đại biểu?","o":{"a":"333","b":"425","c":"475","d":"Cả a, b, c đều sai"},"a":"a","u":0},{"n":167,"q":"Hiến pháp đầu tiên của nước ta được thông qua vào năm nào?","o":{"a":"Năm 1945","b":"Năm 1946","c":"Năm 1950.","d":"Cả 3 đều sai"},"a":"b","u":0},{"n":168,"q":"Quốc hội khóa I của nước ta được lập ra từ thời gian nào?","o":{"a":"Năm 1945","b":"Năm 1946","c":"Năm 1948","d":"Năm 1950"},"a":"b","u":0},{"n":169,"q":"“ Ở nước ta, chính quyền là của nhân dân do nhân dân làm chủ. Nhân dân là ổng chủ nắm chính quyền. Nhân dân bầu ra đại biểu thay mặt mình thi hành chính quyền ấy. Thế là dân chủ”. Câu trên trích từ tác phẩm nào của chủ tịch Hồ Chí Minh ?","o":{"a":"Thường thức chính trị","b":"Đường cách mệnh","c":"Di chúc","d":"Sửa đổi về lối làm việc"},"a":"a","u":0},{"n":170,"q":"Một trong những yêu sách tám điểm gửi hội nghị Véc- Xây mà Nguyễn Ái Quốc đã nêu lên là?","o":{"a":"Đòi quyền bình đẳng cho các dân tộc","b":"Đòi quyền độc lập dân tộc","c":"Đòi quyền tự trị dân tộc","d":"Đòi quyền bình đẳng về pháp lý cho nhân dân Đông Dương"},"a":"d","u":0},{"n":171,"q":"Văn kiện nào thể hiện rõ nhất tư tưởng dân chủ của chủ tịch Hồ Chí Minh?","o":{"a":"Chương trình của mặt trận Việt minh","b":"Tuyên ngôn độc lập","c":"Hiến pháp năm 1946","d":"Hiến pháp năm 1959"},"a":"c","u":0},{"n":172,"q":"Văn kiện nào đầu tiên thể hiện chế độ dân chủ do chủ tịch Hồ Chí Minh thiết kế?","o":{"a":"Tuyên ngôn độc lập","b":"Yêu sách tám điểm gửi hội nghị Vec- Xây","c":"Hiến pháp năm 1946","d":"Chương trình của mặt trận Việt minh"},"a":"c","u":0},{"n":173,"q":"Theo chủ tịch Hồ Chí Minh để thực hiện được dân chủ trong xã hội, trước tiên cần phải thực hiện dân chủ trong tổ chức nào?","o":{"a":"Dân chủ trong chính quyên các cấp","b":"Dân chủ trong quốc hội","c":"Dân chủ trong tổ chức Đảng","d":"Dân chủ trong các đoàn thể nhân dân"},"a":"c","u":0},{"n":174,"q":"Chủ tịch Hồ Chí Minh đã dùng hình ảnh gì để nói về sức mạnh vạn năng của dân chủ?","o":{"a":"Cánh cửa","b":"Cái búa","c":"Cái liềm","d":"Cái chìa khóa"},"a":"d","u":0},{"n":175,"q":"Chủ tịch Hồ Chí Minh đã tham khảo mô hình nhà nước nào để xây dựng nhà nước của dân, do dân và vì dân?","o":{"a":"Nhà nước phong kiến","b":"Nhà nước Xô viết","c":"Nhà nước tư sản","d":"Cả 3 nhà nước kiểu trên"},"a":"d","u":0},{"n":176,"q":"Quan điểm cơ bản nhất của chủ tịch Hồ Chí Minh về xây dựng nhà nước cách mạng?","o":{"a":"Nhà nước pháp quyền Việt Nam","b":"Nhà nước công nông","c":"Nhà nước chuyên chính vô sản","d":"Nhà nước do nhân dân lao động làm chủ"},"a":"d","u":0},{"n":177,"q":"Tư tưởng Hồ Chí Minh về xây dựng nhà nước cách mạng có mấy nội dung?","o":{"a":"2 nội dung","b":"4 nội dung","c":"3 nội dung","d":"5 nội dung"},"a":"c","u":1},{"n":178,"q":"Nội hàm “ nhà nước của dân” gồm những vấn đề gì?","o":{"a":"Mọi quyền lực nhà nước đều thuộc về nhân dân","b":"Nhân dân có quyên kiểm soát mọi hoạt động của nhà nước","c":"Nhà nước phải có trách nhiệm bảo đảm quyền làm chủ của nhân dân","d":"Cả 3 vấn để trên"},"a":"d","u":0},{"n":179,"q":"Theo quan điểm của Hồ Chí Minh và cả trên thực tế nhân dân ta có những quyền gì để làm chủ nhà nước?","o":{"a":"Toàn bộ công dân bầu ra quốc hội- cơ quan quyền lực cao nhất của nhà nước, cơ quan duy nhất có quyền lập pháp","b":"Quốc hội bầu ra chủ tịch nước, ủy ban thường vụ quốc hội và chính phủ","c":"Chính phủ là cơ quan hành chính cao nhất của nhà nước, thực hiện các nghị quyết của quốc hội và chấp hành pháp luật, mọi hoạt động quản lý xã hội bằng pháp luật đều nhằm ý chí của nhân dân (thông qua quốc hội do dân bầu ra)","d":"Cả 3 vấn đề trên."},"a":"d","u":0},{"n":180,"q":"Đặc điểm cơ bản để nhận biết nhà nước ta mạng bản chất giai cấp công nhân là gì?","o":{"a":"Nhà nước ta là sản phẩm của cuộc cách mạng do giai cấp công nhân lãnh đạo","b":"Mục tiêu hàng đầu của nhà nước ta là mạng lại và bảo vệ lợi ích của giai cấp công nhân","c":"Nhà nước ta quản lý, điều hành xã hội theo định hướng XHCN","d":"Nhà nước ta do ĐCS lãnh đạo"},"a":"d","u":0},{"n":181,"q":"Đảng lãnh đạo nhà nước bằng phương thức nào?","o":{"a":"Bằng đường lối, chủ trương để nhà nước thể chế hóa thành pháp luật, chính sách, kế hoạch","b":"Bằng hoạt động của tổ chức đảng và đảng viên trong các cơ quan nhà nước","c":"Bằng công tác kiểm tra của Đảng đối với hoạt động của nhà nước","d":"Cả 3 ý trên"},"a":"d","u":0},{"n":182,"q":"Tính nhân dân, tính dân tộc của nhà nước ta thể hiện ở những nội dung nào?","o":{"a":"Nhà nước ta ra đời là kết quả của cuộc đấu tranh lâu dài của các thế hệ người Việt Nam","b":"Nhà nước ta bảo vệ lợi ích của các tầng lớp nhân dân, lấy lợi ích của dân tộc làm cơ bản","c":"Nhà nước ta được dân tộc giao phó điều hành đất nước trong kháng chiến và trong xây dựng hòa bình","d":"Cả 3 nội dung trên"},"a":"d","u":0},{"n":183,"q":"“ Cải cách nền pháp lý ở Đông dương bằng cách làm cho người bản xứ cũng được quyền hưởng những bảo đảm về mặt pháp luật như người Châu Âu, thay các chế độ ra các đạo lực”. Câu trên trích từ tác phảm nào của Bác Hồ?","o":{"a":"Bản án chế độ thực dân Pháp","b":"Đường cách mệnh","c":"Yêu sách gửi hội nghị Vec- Xây","d":"Báo “ người cùng khổ”"},"a":"c","u":0},{"n":184,"q":"Nội dung quan niệm của chủ tịch Hồ Chí Minh về một nhà nước có hiệu lực pháp lý mạnh mẽ?","o":{"a":"Xây dựng một nhà nước hợp pháp, hợp hiến","b":"Quản lý xã hội bằng pháp luật và đưa pháp luật vào cuộc sống","c":"Xây dựng đội ngũ công chức đủ sức đủ tài","d":"Tất cả các nội dung trên"},"a":"d","u":0},{"n":185,"q":"Để có một nhà nước hợp pháp, hợp hiến việc làm đầu tiên của Hồ Chí Minh sau cách mạng tháng 8/1945 là gì?","o":{"a":"Thiết kế mô hình nhà nước cách mạng","b":"Lựa chọn sắp xếp cán bộ","c":"Tổ chức tổng tuyển cử trong cả nước","d":"Kêu gọi thế giới công nhận chính quyền mới"},"a":"c","u":0},{"n":186,"q":"Mục đích của tổng tuyển cử trong cả nước, theo chế độ phổ thông đầu phiếu là gì?","o":{"a":"Để nhà nước cách mạng có cơ sở pháp lý vững chắc quan hệ với quân đồng minh","b":"Để có mối quan hệ quốc tế bình đẳng về mặt nhà nước","c":"Mới có thể thiết lập một cơ chế quyền lực hợp pháp theo đúng thông lệ quốc tế","d":"Tất cả mục đích trên"},"a":"d","u":0},{"n":187,"q":"Để pháp luật thực hiện nghiêm túc, cần có những điều kiện gi?","o":{"a":"Nâng cao dân trí","b":"Giáo dục pháp luật cho nhân dân","c":"Cán bộ,đảng viên,nêu gương chấp hành pháp luật","d":"Tất cả những điều kiên trên"},"a":"d","u":0},{"n":188,"q":"Theo Hồ Chí Minh xây dựng đội ngũ công chức nhà nước theo những tiêu chuẩn nào?","o":{"a":"Tuyệt đối trung thành với cách mạng ,liên hệ mật thiết với nhân dân","b":"Giỏi chuyên môn,nghiệp vụ","c":"Dám phụ trách,quyết đoán,dám chịu trách nhiệm,thắng không kiêu,bại không nản;thường xuyên tự phê bình và phê bình vì sự trong sạch của nhà nước","d":"Tất cả những tiêu chuẩn trên"},"a":"d","u":0},{"n":189,"q":"Theo Hồ Chí Minh , muốn xây dựng nhà nước trong sạch vững mạnh,cần chống những căn bệnh nào?","o":{"a":"Đặt quyền,đặt lợi","b":"Tư túng, chia rẽ, kiêu ngạo","c":"Tham ô, lãng phí, quan liêu","d":"Tất cả những căn bệnh trên"},"a":"d","u":0},{"n":190,"q":"Hồ Chí Minh trình bày khái niêm văn hóa năm nào?","o":{"a":"8/1941","b":"8/1943","c":"8/1942","d":"8/1944"},"a":"b","u":0},{"n":191,"q":"Định nghĩa văn hóa của Hồ Chí Minh đã khắc phục được những quan niệm phiến diện nào?","o":{"a":"Coi văn hóa là hiện tượng thuần túy tinh thần","b":"Đồng nhất văn hóa với văn học- nghệ thuật","c":"Đồng nhất văn hóa với học vấn","d":"Tất cả những quan niệm trên"},"a":"d","u":0},{"n":192,"q":"Nội dung nền văn hóa mới, theo quan niêm của Hồ Chí Minh gồm mấy vấn đề?","o":{"a":"3 vấn đề","b":"5 vấn đề","c":"4 vấn đề","d":"6 vấn đề"},"a":"b","u":0},{"n":193,"q":"Hồ Chí Minh quan niêm văn hóa phải ở trong chính trị và kinh tế. Điều dó có nghĩa là?","o":{"a":"Văn hóa phải phục vụ chính trị","b":"Văn hóa phải thúc đẩy kinh tế phát triển","c":"Kinh tế và chính trị cũng phải có tính văn hóa","d":"Tất cả các vấn đề trên"},"a":"d","u":0},{"n":194,"q":"Trong quan niệm của chủ tịch Hồ Chí Minh, nền văn hóa mới có mấy tinh chất","o":{"a":"Hai tính chất","b":"Bốn tính chất","c":"Ba tính chất","d":"Năm tính chất"},"a":"c","u":0},{"n":195,"q":"Câu nào trong bức thư “ sẻ cơm nhường áo” viết tháng 9/1945, nói lên tình cảm nhân văn của Hồ Chí Minh được thể hiện bằng hành động?","o":{"a":"Từ tháng giêng đến tháng bảy năm nay, ở Bắc bộ ta có 2 triệu người chết đói","b":"Kế đó lại bị lụt, nạn đói càng tăng thêm, nhân dân càng đói khổ","c":"Lúc chúng ta nâng bát cơm ăn, nghĩ đến kẻ đói khổ, chúng ta không khỏi động lòng","d":"Vậy, tôi xin đề nghị với đông bào cả nước và tôi xin thực hành trước, cứ 10 ngày nhịn ăn một bữa, mỗi tháng nhịn 3 bưa.Đem gạo đó ( mỗi bữa một bơ ) để cứu dân nghèo."},"a":"d","u":0},{"n":196,"q":"Tính khoa học của nền văn hóa đối lập với những vấn đề gi trong văn hóa?","o":{"a":"Phản tiến bộ","b":"Quan điểm duy tâm","c":"Quan niêm thần bí, mê tính dự đoan","d":"Tất cả những vấn đề trên"},"a":"d","u":0},{"n":197,"q":"Theo quan niệm của Hồ Chí Minh, nền văn hóa mới có mấy chức năng?","o":{"a":"1 chức năng","b":"2 chức năng","c":"3 chức năng","d":"4 chức năng"},"a":"c","u":0},{"n":198,"q":"Nội dung chức năng của văn hóa theo quan niệm Hồ Chí Minh của là gi?","o":{"a":"Bồi dưỡng tư tưởng đúng đắn và tình cảm cao đẹp","b":"Nâng cao dân trí","c":"Bồi dưỡng phẩm chất,phong cách và lối sống đẹp, hướng con người đến chân,thiện,mỹ.","d":"Tất cả những nội dung trên"},"a":"d","u":0},{"n":199,"q":"Theo Hồ Chí Minh, văn hóa gồm mấy lĩnh vực?","o":{"a":"2 lĩnh vực","b":"4 lĩnh vực","c":"3 lĩnh vực","d":"5 lĩnh vực"},"a":"c","u":1},{"n":200,"q":"Hồ Chí Minh đưa ra những hạn chế nào của nền giáo dục phong kiến?","o":{"a":"Từ chương, kinh viên","b":"Xa rời thực tế","c":"Bất bình đẳng trọng nam, khinh nữ","d":"Tất cả những hạn chế trên"},"a":"d","u":0},{"n":201,"q":"Hồ Chí Minh đánh giá cao nhất yếu tố nào trong giá trị văn hóa dân tộc?","o":{"a":"Ý thức đoàn kết cộng đồng","b":"Lòng yêu nước","c":"Yêu lao động","d":"Lòng thương người"},"a":"b","u":0},{"n":202,"q":"Đặc trưng chủ yếu của tư tưởng đạo đức Hồ Chí Minh là gi?","o":{"a":"Lòng yêu thương con người","b":"Lòng yêu thương nhân dân lao động","c":"Chủ nghĩa nhân đạo chiến đấu","d":"Sự thống nhất giữa nói và làm"},"a":"d","u":1},{"n":203,"q":"Trong tư tưởng Hồ Chí Minh, đạo đức cách mạng có vai trò gì?","o":{"a":"Là nền tảng lý luận của người cách mạng","b":"Là phương châm hành động của người lao động","c":"Là cái gốc, là nền tảng của người cách mạng","d":"Là lẽ sống của người cách mạng"},"a":"c","u":0},{"n":204,"q":"Có mấy nguyên tắc xây dựng đạo đức mới?","o":{"a":"2 nguyên tắc","b":"3 nguyên tắc","c":"4 nguyên tắc","d":"5 nguyên tắc"},"a":"b","u":0},{"n":205,"q":"Con người Việt Nam trong thời đại mới cần có mấy phẩm chất đạo đức?","o":{"a":"3 phẩm chất","b":"4 phẩm chất","c":"5 phẩm chất","d":"6 phẩm chất"},"a":"b","u":1},{"n":206,"q":"“Cũng như sông có nguồn thì mới có nước, không có nguồn thì sông cạn. Cây phải có gốc, không gốc thì cây héo”. Câu trên trích từ tác phẩm nào?","o":{"a":"Đường cách mạng","b":"Di chúc","c":"Chính cương sách lược vắn tắt","d":"Đạo đức cách mạng"},"a":"d","u":0},{"n":207,"q":"Theo Hồ Chí Minh, trong tình hình thực tế yếu tố nào của CNXH có sức hấp dẫn đặc biệt?","o":{"a":"Lí tưởng cao đẹp","b":"Mức sống vật chất dồi dào","c":"Những giá trị đạo đức cao đẹp","d":"Tư tưởng được tự do giải phóng"},"a":"c","u":0},{"n":208,"q":"Nội dung của lòng trung với nước, hiếu với dân trong tư tưởng HCM?","o":{"a":"Suốt đời phấn đấu cho đảng cho cách mạng","b":"Thương dân, tin dân, dựa vào dân","c":"Dựa vào dân, coi dân là gốc của nước","d":"Tất cả các câu trên"},"a":"d","u":0},{"n":209,"q":"“Trời có bốn mùa: Xuân, Hạ, Thu, Đông Đất có bốn phương: Đông, Tây, Nam, Bắc Thiếu một mùa thì không thành trời Thiếu một phương thì không thành đất Thiếu một đức thì không thành người” Những câu nói trên được trích từ tác phẩm nào của HCM?","o":{"a":"Đạo đức cách mạng","b":"Nâng cao đạo đức cách mạng, quét sạch chủ nghĩa cá nhân","c":"Cần kiệm liêm chính","d":"Bài nói chuyện tại Đại học Bách Khoa Hà Nội"},"a":"c","u":0},{"n":210,"q":"“Hiểu chủ nghĩa Mac- lênin là phải sống với nhau có nghĩa, có tình. Nếu thuộc bao nhiêu sách mà không có tình, có nghĩa thì sao gọi là hiểu chủ nghĩa Mac- lenin được. Câu trên trích từ tác phẩm nào ?","o":{"a":"Hồ Chí Minh toàn tập. t10","b":"Hồ Chí Minh toàn tập. t11","c":"Hồ Chí Minh toàn tập. t12","d":"Hồ Chí Minh toàn tập. t13"},"a":"b","u":1},{"n":211,"q":"Theo quan niệm của Hồ Chí Minh, trong mỗi con người thì có :","o":{"a":"Cái thiện","b":"Có tốt, có xấu","c":"Cái ác","d":"Tùy thuộc từng người"},"a":"b","u":0},{"n":212,"q":"Hồ Chí Minh nói : ‘‘Chủ nghia xã hội cộng với khoa học sẽ đưa loài người đến {…}’’. Hãy điền vào ô trống để hoàn thiện câu trên","o":{"a":"Hạnh phúc vô tận","b":"Tự do","c":"Tương lai xán lạn","d":"Sự phát triển toàn diện"},"a":"a","u":0},{"n":213,"q":"Tác phẩm đầu tiên của Hồ Chí Minh đề cập đến đạo đức cách mạng.","o":{"a":"Đạo đức cách mạng (1955)","b":"Đường các mệnh (1927)","c":"Bản án chế độ thực dân Pháp (1925)","d":"Thường thức chính trị (1953)"},"a":"b","u":0},{"n":214,"q":"Hồ Chí Minh đề cập đạo đức trong những quan hệ nào của con người ?","o":{"a":"Đối với người","b":"Đối với mình","c":"Đối với việc","d":"Cả a, b, c"},"a":"d","u":0},{"n":215,"q":"Chọn cụm từ đúng điền vào dấu… ‘‘ Người cách mạng phải có…thì mới gánh được nặng và đi được xa’’","o":{"a":"Trí tuệ","b":"Đạo đức cách mạng","c":"Phương pháp cách mạng","d":"Ý chí cách mạng"},"a":"b","u":0},{"n":216,"q":"Trong cách mạng dân tộc dân chủ nhân dân, nền văn hóa mới có những tính chất nào?","o":{"a":"Dân tộc","b":"Khoa học","c":"Đại chúng","d":"Cả a, b, c"},"a":"d","u":0},{"n":217,"q":"Theo Hồ Chí Minh, mục tiêu của giáo dục là gì?","o":{"a":"Xóa nạn mù chữ, làm cho người dân biết đọc, biết viết","b":"Hình thành đội ngũ trí thức cách mạng","c":"Đào tạo những con người tốt, những cán bộ thực dân Pháp","d":"Đạo đức cách mạng."},"a":"d","u":0},{"n":233,"q":"Chỉ ra đâu là câu nói của Hồ Chí Minh ?","o":{"a":"Chữ tâm kia mới bằng ba chữ tài","b":"Tiên tri nào cũng bị hắt hủi trên chính quê hương mình","c":"Đạo đức là cái gốc của người cách mạng.","d":"Nhiệt tình + Ngu dốt = Phá hoại"},"a":"c","u":0},{"n":234,"q":"Chiến lược “ Trồng người” đươc Hồ Chí Minh quan niệm như thế nào?","o":{"a":"Trồng người là yêu cầu khách quan, vừa cấp bách, vừa lâu dài của cách mạng","b":"Muốn xây dựng chủ nghĩa xã hội, trước hết cần có những con người xã hội chủ nghĩa.","c":"Chiến lược “trồng người là một trọng tâm, một bộ phận hợp thành của chiến lược phát triển kinh tế - xã hội.","d":"Cả 3 ý trên đều đúng"},"a":"d","u":0},{"n":235,"q":"“Sức có mạnh mới gánh được nặng và đi được xa. Người cách mạng phải có đạo đức cách mạng làm nền tảng, mới hoàn thành được nhiệm vụ cách mạng vẻ vang”. Câu nói trên của Người được trích ở tác phẩm nào?","o":{"a":"Đạo đức cách mạng.","b":"Thường Thức Chính trị","c":"Đường cách mệnh.","d":"Bản án chế độ thực dân Pháp"},"a":"a","u":0},{"n":236,"q":"Trong quan niệm Hồ Chí Minh, văn hóa có những tính chất nào?","o":{"a":"Tinh khoa học","b":"Tinh dân tộc","c":"Tính đại chúng","d":"Cả 3 tính chất trên"},"a":"d","u":0},{"n":237,"q":"Bác Hồ nhấn mạnh: “ Vì lợi ích mười năm trồng cây, vì lợi ích trăm năm…..?","o":{"a":"Trồng rừng","b":"Trồng người","c":"Hạnh phúc","d":"Cả 3 đều sai."},"a":"b","u":0},{"n":238,"q":"Người căn dặn: “Mỗi đảng viên và cán bộ phải thật sự thầm nhuần đạo đức cách mạng, thật sự cần kiệm liêm chính, chí công vô tư. Phải giữ gìn Đảng ta thật sự trong sạch, phải xứng đáng là người lãnh đạo, là người…..? Điền cụm từ còn thiếu.","o":{"a":"Là bề tôi của nhân dân","b":"Là người tôi tớ trung thành của nhân dân","c":"Là người đầy tớ thật trung thành của nhân dân","d":"Là người cai trị của nhân dân"},"a":"c","u":0},{"n":239,"q":"“Một ĐẢng mà giấu giếm khuyết điểm của mình là một Đảng hỏng. Một Đảng có gan thừa nhận khuyết điểm của mình, vạch rõ những cái đó, vì đâu mà có rồi tìm kiếm mọi cách để sửa chữa khuyết điểm đó. Như thế là một Đảng tiến bộ, mạnh dạn, chắc chắn, chân chính”. Câu nói trên trích trong tác phẩm nào?","o":{"a":"Con rồng tre","b":"Trích phát biểu của Chủ tịch Hồ Chí Minh trong lễ kỉ niệm 20 năm ngày thành lập Quân đội Nhân dân Việt Nam, năm 1964","c":"Sửa đổi lề lôi làm việc","d":"Cả 3 đều sai"},"a":"c","u":0},{"n":240,"q":"Hồ Chí Minh nhìn nhận con người ở phương diện nào?","o":{"a":"Con người được nhìn nhận theo một chỉnh thể, đa chiều","b":"Con người lịch sử, cụ thể","c":"Bản chất con người mang tính xã hội","d":"Tất cả các phương diện trên"},"a":"d","u":0}];
const L=['a','b','c','d'];
let order=DATA.map((_,i)=>i), state={}; // state[idx]={pick:'x'|null}
const $=id=>document.getElementById(id);
function build(){
  state={};
  $('sum').style.display='none';
  $('list').innerHTML='';$('grid').innerHTML='';
  order.forEach((idx,pos)=>{
    const d=DATA[idx];
    const c=document.createElement('div');c.className='q';c.id='q'+idx;
    let h='<div class="qh">Câu '+(pos+1)+'. '+esc(d.q)+'<small>(câu gốc '+d.n+')</small></div>';
    L.forEach(k=>{h+='<button class="op" data-k="'+k+'"><b>'+k+'.</b><span>'+esc(d.o[k])+'</span></button>'});
    h+='<div class="res"></div><button class="show">Hiện đáp án</button>';
    c.innerHTML=h;
    c.querySelectorAll('.op').forEach(b=>b.onclick=()=>answer(idx,b.dataset.k));
    c.querySelector('.show').onclick=()=>answer(idx,null);
    $('list').appendChild(c);
    const g=document.createElement('a');g.href='#q'+idx;g.id='g'+idx;g.textContent=pos+1;
    $('grid').appendChild(g);
  });
  upd();
}
function esc(s){return s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function answer(idx,pick){
  if(state[idx])return;
  const d=DATA[idx];state[idx]={pick};
  const c=$('q'+idx);
  c.querySelectorAll('.op').forEach(b=>{
    b.disabled=true;
    if(b.dataset.k===d.a)b.classList.add('ok');
    else if(b.dataset.k===pick)b.classList.add('no');
  });
  const r=c.querySelector('.res');r.style.display='block';
  let t=pick===null?'Đáp án đúng: ':(pick===d.a?'✓ Chính xác! Đáp án đúng: ':'✗ Chưa đúng. Đáp án đúng: ');
  r.innerHTML='<span class="a">'+t+'('+d.a+')</span>'+(d.u?'<div class="w">⚠ Đáp án này chưa chắc chắn, hãy đối chiếu với giáo trình.</div>':'');
  c.querySelector('.show').style.display='none';
  const g=$('g'+idx);g.className=pick===null?'rv':(pick===d.a?'ok':'no');
  upd();
}
function upd(){
  const done=Object.keys(state).length,tot=DATA.length;
  const right=Object.values(state).filter((s,i)=>0).length;
  let ok=0,bad=0,rv=0;
  Object.keys(state).forEach(i=>{const s=state[i];if(s.pick===null)rv++;else if(s.pick===DATA[i].a)ok++;else bad++});
  $('pb').style.width=(done/tot*100)+'%';
  $('st').textContent='Đã làm '+done+'/'+tot+' · Đúng '+ok+' · Sai '+bad;
  const all=done===tot;
  $('shuf').disabled=!all;
  $('shuf').title=all?'Xáo trộn thứ tự câu hỏi và làm lại':'Làm xong tất cả các câu để mở khóa';
  const s=$('sum');
  if(all){s.style.display='block';s.innerHTML='🎉 <b>Bạn đã làm xong cả '+tot+' câu!</b> Đúng '+ok+' · Sai '+bad+(rv?' · Xem đáp án '+rv:'')+'. Bấm “Đảo câu hỏi ngẫu nhiên” để ôn lại theo thứ tự mới.'}
}
$('shuf').onclick=()=>{
  for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
  build();window.scrollTo({top:0,behavior:'smooth'});
};
$('rst').onclick=()=>{if(Object.keys(state).length&&!confirm('Xóa toàn bộ kết quả và làm lại từ đầu?'))return;order=DATA.map((_,i)=>i);build();window.scrollTo({top:0})};
build();
</script>
